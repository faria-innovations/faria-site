  <!-- bottom rule -->
  <line x1="64" y1="566" x2="1136" y2="566" stroke="#111111" stroke-width="2"/>
  <!-- Fi mark bottom right -->
  <rect x="1080" y="576" width="40" height="40" fill="none" stroke="#0A1F44" stroke-width="2"/>
