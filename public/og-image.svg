<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F0EDE4"/>

  <!-- top + bottom structural rules -->
  <line x1="64"  y1="64"  x2="1136" y2="64"  stroke="#111111" stroke-width="2"/>
  <line x1="64"  y1="566" x2="1136" y2="566" stroke="#111111" stroke-width="2"/>

  <!-- ===================================================== -->
  <!-- left: radar signal mark                               -->
  <!-- ===================================================== -->
  <g transform="translate(64,120) scale(0.22)">
    <g fill="none" stroke="#0A1F44">
      <circle cx="500" cy="500" r="120" stroke-width="14"/>
      <circle cx="500" cy="500" r="240" stroke-width="14"/>
      <circle cx="500" cy="500" r="360" stroke-width="14"/>
      <circle cx="500" cy="500" r="480" stroke-width="18"/>
      <line x1="500" y1="500" x2="784" y2="161" stroke-width="22"/>
      <line x1="500" y1="20"  x2="500" y2="68"  stroke-width="14"/>
      <line x1="500" y1="932" x2="500" y2="980" stroke-width="14"/>
      <line x1="20"  y1="500" x2="68"  y2="500" stroke-width="14"/>
      <line x1="932" y1="500" x2="980" y2="500" stroke-width="14"/>
      <polyline points="640,720 640,672 692,672" stroke-width="14"/>
      <polyline points="770,672 822,672 822,720" stroke-width="14"/>
      <polyline points="640,794 640,842 692,842" stroke-width="14"/>
      <polyline points="770,842 822,842 822,794" stroke-width="14"/>
    </g>
    <circle cx="731" cy="712" r="14" fill="#0A1F44"/>
    <text x="731" y="816" text-anchor="middle"
      font-family="'Saira','Helvetica Neue',system-ui,sans-serif"
      font-weight="900" font-style="italic" font-size="86" fill="#0A1F44">Fi</text>
  </g>

  <!-- ===================================================== -->
  <!-- FARIA wordmark lockup (controlled SVG, slanted)       -->
  <!-- ===================================================== -->
  <g transform="translate(360,120)">
    <g transform="skewX(-7)">
      <text x="0" y="120"
        font-family="'Saira','Helvetica Neue Condensed','Arial Narrow',system-ui,sans-serif"
        font-weight="900" font-size="140" letter-spacing="6"
        fill="#0A1F44">FARIA</text>
    </g>
    <rect x="0" y="140" width="480" height="10" fill="#0A1F44"/>
    <text x="0" y="190"
      font-family="'Saira','Helvetica Neue',system-ui,sans-serif"
      font-weight="600" font-size="28" letter-spacing="14"
      fill="#0A1F44">INNOVATIONS</text>
  </g>

  <!-- ===================================================== -->
  <!-- oversized 01 — navy, single dramatic gesture          -->
  <!-- ===================================================== -->
  <text x="64" y="540"
    font-family="'Saira','Helvetica Neue Condensed','Arial Narrow',system-ui,sans-serif"
    font-size="320" font-weight="900" letter-spacing="-12"
    fill="#0A1F44" opacity="0.96">01</text>

  <!-- ===================================================== -->
  <!-- registry block on the right                           -->
  <!-- ===================================================== -->
  <g font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="14" letter-spacing="2">
    <line x1="600" y1="320" x2="1136" y2="320" stroke="#B8BCC3" stroke-width="1"/>

    <text x="600" y="350" font-weight="600" fill="#111111">FILE</text>
    <text x="780" y="350" fill="#6E737C">FARIA INNOVATIONS LLC</text>
    <line x1="600" y1="370" x2="1136" y2="370" stroke="#B8BCC3" stroke-width="1"/>

    <text x="600" y="400" font-weight="600" fill="#111111">TYPE</text>
    <text x="780" y="400" fill="#6E737C">PARENT COMPANY / VENTURE INDEX</text>
    <line x1="600" y1="420" x2="1136" y2="420" stroke="#B8BCC3" stroke-width="1"/>

    <text x="600" y="450" font-weight="600" fill="#111111">INDEX</text>
    <text x="780" y="450" fill="#6E737C">PARCENTRY / FLIGHT RISK / LABS</text>
    <line x1="600" y1="470" x2="1136" y2="470" stroke="#B8BCC3" stroke-width="1"/>

    <text x="600" y="500" font-weight="600" fill="#111111">LOCATION</text>
    <text x="780" y="500" fill="#6E737C">BELTSVILLE, MARYLAND</text>
    <line x1="600" y1="520" x2="1136" y2="520" stroke="#B8BCC3" stroke-width="1"/>
  </g>

  <!-- ===================================================== -->
  <!-- engineered Fi registration mark — bottom right         -->
  <!-- ===================================================== -->
  <g transform="translate(1080,576)">
    <rect x="0"  y="0"  width="40" height="40" fill="none" stroke="#0A1F44" stroke-width="2"/>
    <line x1="20" y1="0"  x2="20" y2="6"  stroke="#0A1F44" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="40" stroke="#0A1F44" stroke-width="1.5"/>
    <line x1="0"  y1="20" x2="6"  y2="20" stroke="#0A1F44" stroke-width="1.5"/>
    <line x1="34" y1="20" x2="40" y2="20" stroke="#0A1F44" stroke-width="1.5"/>
    <g fill="none" stroke="#0A1F44" stroke-width="2.5" stroke-linecap="square">
      <line x1="12" y1="12" x2="12" y2="30"/>
      <line x1="12" y1="12" x2="22" y2="12"/>
      <line x1="12" y1="20" x2="20" y2="20"/>
    </g>
    <g fill="#0A1F44">
      <rect x="26" y="17" width="3" height="13"/>
      <rect x="26" y="12" width="3" height="3"/>
    </g>
  </g>
</svg>
