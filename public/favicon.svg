<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" fill="#0A1F44"/>
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#F0EDE4" stroke-width="2"/>
  <line x1="32" y1="4"  x2="32" y2="10" stroke="#F0EDE4" stroke-width="1.5"/>
  <line x1="32" y1="54" x2="32" y2="60" stroke="#F0EDE4" stroke-width="1.5"/>
  <line x1="4"  y1="32" x2="10" y2="32" stroke="#F0EDE4" stroke-width="1.5"/>
  <line x1="54" y1="32" x2="60" y2="32" stroke="#F0EDE4" stroke-width="1.5"/>
  <!-- F: stem, top arm, crossbar — drawn as paths, no font dependency -->
  <g fill="none" stroke="#F0EDE4" stroke-width="4" stroke-linecap="square">
    <line x1="20" y1="22" x2="20" y2="48"/>
    <line x1="20" y1="22" x2="34" y2="22"/>
    <line x1="20" y1="34" x2="32" y2="34"/>
  </g>
  <!-- i: stem + tittle -->
  <g fill="#F0EDE4">
    <rect x="40" y="29" width="4" height="19"/>
    <rect x="40" y="22" width="4" height="4"/>
  </g>
</svg>
